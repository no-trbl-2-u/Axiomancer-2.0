<!DOCTYPE html>
<html>
<head>
    <title>Reset Character</title>
</head>
<body>
    <h1>Reset Character Creation</h1>
    <p>This will clear your character data and show the character creation screen.</p>
    <button onclick="resetCharacter()">Reset Character</button>
    <script>
        function resetCharacter() {
            localStorage.removeItem('axiomancer_character');
            localStorage.removeItem('axiomancer_gameState');
            alert('Character data cleared! Refresh the main page to see character creation.');
        }
    </script>
</body>
</html>
